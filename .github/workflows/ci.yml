name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate skill format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository tooling
        run: >-
          python3 -m pip install
          -c maintainer/data/token_tooling_constraints.txt
          tiktoken PyYAML

      - name: Install official skills-ref dependencies
        run: >-
          python3 -m pip install
          -c maintainer/data/skills_ref_constraints.txt
          hatchling==1.27.0 click==8.3.1 strictyaml==1.7.3
          python-dateutil==2.9.0.post0 six==1.17.0

      - name: Install pinned official skills-ref
        run: >-
          python3 -m pip install --no-build-isolation --no-deps
          'skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'

      - name: Verify official validator environment
        run: |
          test "$(skills-ref --version)" = 'skills-ref, version 0.1.0'
          python3 -m pip check

      - name: Check canonical source boundary
        run: |
          echo "Checking that SKILL.md files only exist under skills/..."
          SKILL_FILES=$(git ls-files | awk '/(^|\/)SKILL\.md$/ && $0 !~ /^skills\/[^/]+\/SKILL\.md$/')
          if [ -n "$SKILL_FILES" ]; then
            echo "ERROR: SKILL.md files found outside skills/:"
            echo "$SKILL_FILES"
            exit 1
          fi
          echo "OK: All SKILL.md files are under skills/"

      - name: Validate Agent Skills packages
        run: python3 maintainer/scripts/analysis/validate_agent_skills.py

      - name: Validate every package with pinned official skills-ref
        run: |
          python3 maintainer/scripts/analysis/validate_skill_catalog.py \
            --print-all-skills > /tmp/agent-skills-catalog.txt
          LC_ALL=C sort -c /tmp/agent-skills-catalog.txt
          skill_count=$(wc -l < /tmp/agent-skills-catalog.txt)
          if [ "$skill_count" -ne 12 ]; then
            echo "ERROR: expected 12 cataloged Skills, got $skill_count"
            exit 1
          fi
          while IFS= read -r skill; do
            skills-ref validate "skills/$skill"
          done < /tmp/agent-skills-catalog.txt

      - name: Validate canonical Skill catalog
        run: python3 maintainer/scripts/analysis/validate_skill_catalog.py

      - name: Check skill cross references
        run: python3 maintainer/scripts/analysis/check_cross_references.py --fail-on-broken

  validate-scripts:
    name: Validate tooling syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository tooling
        run: >-
          python3 -m pip install
          -c maintainer/data/token_tooling_constraints.txt
          tiktoken PyYAML

      - name: Enforce repository layout boundaries
        run: python3 maintainer/scripts/analysis/validate_repo_layout.py

      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path("maintainer").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"OK: {path}")
          PY

      - name: Run review-loop output contract self-test
        run: python3 maintainer/scripts/evaluation/test_review_loop_output_contract.py

      - name: Run artifact routing contract report
        run: >-
          python3 maintainer/scripts/evaluation/run_artifact_routing_tests.py
          --mode report --fail-on-contract-issues

      - name: Run artifact routing contract self-test
        run: python3 maintainer/scripts/evaluation/test_artifact_routing_contract.py

      - name: Run ADR contract self-test
        run: python3 maintainer/scripts/evaluation/test_adr_contract.py

      - name: Run token regression contract self-test
        run: python3 maintainer/scripts/evaluation/test_token_regression_contract.py

      - name: Run Agent Skills tooling contract self-test
        run: python3 maintainer/scripts/evaluation/test_agent_skills_tooling_contract.py

      - name: Run Skill catalog contract self-test
        run: python3 maintainer/scripts/evaluation/test_skill_catalog_contract.py

      - name: Run activation-token contract self-test
        run: python3 maintainer/scripts/evaluation/test_token_activation_contract.py

      - name: Enforce activation-token budgets
        run: >-
          python3 maintainer/scripts/analysis/measure_prompt_surface.py
          --actual-tokens --validate-activation-contract --fail-on-budget

      - name: Check deterministic compact index
        run: python3 maintainer/scripts/analysis/generate_skill_index.py --check

      - name: Check compact metadata parity
        run: python3 maintainer/scripts/evaluation/compare_prompt_sizes.py

      - name: Build client-independent trigger report
        run: python3 maintainer/scripts/evaluation/run_trigger_tests.py --mode report --fail-on-protocol-issues
