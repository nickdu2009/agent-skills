- id: activation_paths
  category: static
  prompt: |
    Read {{GOVERNANCE_FILE}}.
    Evaluate this fixed live skill set from the current governance model:
    ["bugfix-workflow","safe-refactor","scoped-tasking","design-before-plan",
     "impact-analysis","self-review","targeted-validation","manage-agents-md",
     "requirements-review-loop","design-review-loop","plan-review-loop",
     "code-review-loop","test-review-loop","multi-agent-protocol"]
    For each skill in that list, determine whether {{GOVERNANCE_FILE}} gives it
    at least one explicit activation path through any of:
       - task-type activation
       - mid-task escalation bullets
       - review-loop activation bullets
       - first position in each Common Flow Pattern
    Return the skills from that fixed list that are still missing an activation path.
    Respond in JSON only:
    {"all_skills": [...], "activated": [...], "orphaned": [...]}
  judge: 'len(d["orphaned"]) == 0'
  expect_current: pass

- id: local_continue
  category: behavioral
  prompt: |
    Read {{GOVERNANCE_FILE}}.
    A task is: "rename a local variable in one file, then run local lint on that file."
    Based ONLY on the governance file, should the agent continue without an extra
    user confirmation?
    Respond in JSON only:
    {"should_continue": true/false,
     "should_ask": true/false,
     "rule_cited": "exact quote from the file, or null if no rule covers this"}
  judge: 'd["should_continue"] is True and d["should_ask"] is False and d["rule_cited"] is not None and len(d["rule_cited"]) > 0'
  expect_current: pass

